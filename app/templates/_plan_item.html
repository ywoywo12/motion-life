<div class="item-row">
  <div class="item-head">
    <img class="thumb" data-thumb width="72" height="66" alt="" {% if it.exercise_code %}src="/library/figure/{{ it.exercise_code }}.svg"{% else %}hidden{% endif %}>
    <span class="badge info" data-prog-label {% if not it.program_label %}hidden{% endif %}>برنامج الجهاز: {{ it.program_label or '' }}</span>
    {% if it.exercise_code %}<span class="badge">من مكتبة التمارين</span>{% endif %}
  </div>
  <input type="hidden" name="items[{{ i }}].exercise_code" value="{{ it.exercise_code or '' }}">
  <input type="hidden" name="items[{{ i }}].program_code" value="{{ it.program_code or '' }}">
  <div class="form-row">
    <div class="field"><label>الفئة</label><select name="items[{{ i }}].category">{% for k, l in CATEGORY_LABELS.items() %}<option value="{{ k }}" {% if it.category == k %}selected{% endif %}>{{ l }}</option>{% endfor %}</select></div>
    <div class="field"><label>اسم الإجراء/التمرين</label><input name="items[{{ i }}].title" value="{{ it.title or '' }}" required></div>
    <div class="field"><label>الجهاز (لبنود الأجهزة)</label><select name="items[{{ i }}].equipment_code"><option value="">—</option>{% for code, e in v.equipment.items() %}<option value="{{ code }}" {% if it.equipment_code == code %}selected{% endif %}>{{ e.name_ar or "" }} — {{ e.name }}</option>{% endfor %}</select></div>
    <div class="field"><label>المرحلة</label><select name="items[{{ i }}].phase"><option value="">—</option>{% for ph in ['1','2','3','1-2','2-3','1-3'] %}<option value="{{ ph }}" {% if it.phase == ph %}selected{% endif %}>{{ ph }}</option>{% endfor %}</select></div>
  </div>
  <div class="form-row">
    <div class="field"><label>الهدف من الإجراء</label><input name="items[{{ i }}].target" value="{{ it.target or '' }}"></div>
    <div class="field"><label>الجرعة/المعايير (يحددها المختص)</label><input name="items[{{ i }}].dosage" value="{{ it.dosage or '' }}"></div>
    <div class="field"><label>طريقة التنفيذ</label><input name="items[{{ i }}].method" value="{{ it.method or '' }}"></div>
  </div>
  <div class="form-row">
    <div class="field"><label>الاحتياطات</label><input name="items[{{ i }}].precautions" value="{{ it.precautions or '' }}"></div>
    <div class="field"><label>معايير التقدم</label><input name="items[{{ i }}].progression_criteria" value="{{ it.progression_criteria or '' }}"></div>
    <div class="field"><label>معايير التوقف</label><input name="items[{{ i }}].stop_criteria" value="{{ it.stop_criteria or '' }}"></div>
  </div>
  <div class="actions"><label class="check"><input type="checkbox" name="items[{{ i }}].contraindications_reviewed" {% if it.contraindications_reviewed %}checked{% endif %}> (للأجهزة) راجعتُ الاستطباب والموانع والاحتياطات حسب تعليمات الشركة المصنعة وسياسة المركز</label>
    <button type="button" class="link" data-remove-row>حذف البند</button></div>
</div>
