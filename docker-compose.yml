# Local/VPS stack. NOT executed in the development sandbox (no Docker daemon available there).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: motionlife
      POSTGRES_USER: ml_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ml_app"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://ml_app:${DB_PASSWORD}@db:5432/motionlife
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      COOKIE_SECURE: "1"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      UPLOAD_DIR: /app/var/uploads
    volumes: [uploads:/app/var/uploads]
    ports: ["127.0.0.1:8000:8000"]   # put Nginx/Caddy with HTTPS in front
volumes: { pgdata: {}, uploads: {} }
